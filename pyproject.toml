[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enerco-energy-analysis"
version = "0.1.0"
description = "Pipeline analitik për profilet orare të konsumit të EnerCo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
ui = ["plotly>=5.24", "streamlit>=1.40"]
dev = ["pytest>=8.3"]

[project.scripts]
enerco-analysis = "enerco_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

